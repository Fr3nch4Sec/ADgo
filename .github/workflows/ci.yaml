name: Go CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'     # On suit ton go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Clean and Tidy modules
        run: |
          rm -f go.sum
          go clean -modcache
          go mod tidy
          go mod verify
          go mod download

      - name: Build
        run: go build -v -o /dev/null ./cmd/adgo

      - name: golangci-lint (optionnel)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          skip-pkg-cache: true
          skip-build-cache: true
