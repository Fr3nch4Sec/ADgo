name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ============================================================
  # Build sur Windows, Linux, macOS
  # ============================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: go build -o adgo.exe ./cmd/adgo

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: go build -o adgo ./cmd/adgo

      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: adgo-windows
          path: adgo.exe

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: adgo-linux
          path: adgo

  # ============================================================
  # Tests
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Run tests
        run: go test -v -race -timeout 120s ./...

      - name: Test coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out | tail -1

  # ============================================================
  # go vet — détection de bugs
  # ============================================================
  vet:
    name: go vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: go vet
        run: go vet ./...

  # ============================================================
  # golangci-lint — analyse statique
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ============================================================
  # Release automatique sur tag
  # ============================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test, vet]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build release binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o adgo-windows-amd64.exe ./cmd/adgo
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o adgo-linux-amd64       ./cmd/adgo
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o adgo-macos-amd64       ./cmd/adgo
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o adgo-linux-arm64       ./cmd/adgo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            adgo-windows-amd64.exe
            adgo-linux-amd64
            adgo-macos-amd64
            adgo-linux-arm64
          generate_release_notes: true