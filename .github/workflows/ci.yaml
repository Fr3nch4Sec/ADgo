name: Go CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'        # ou '1.23' si tu préfères plus de stabilité
          cache: true               # Active le cache des modules Go (très important)
          cache-dependency-path: go.sum

      - name: Verify & Tidy modules
        run: |
          go mod tidy
          go mod verify
          go mod download

      - name: Build
        run: |
          go build -v -o /dev/null ./cmd/adgo

      - name: Run tests
        run: |
          go test -v -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          # skip-cache: true          # décommente si tu as encore des soucis de cache
