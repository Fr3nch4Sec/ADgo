name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Permet d'annuler les runs précédents quand on push plusieurs fois rapidement
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────
  # Build multi-plateforme (mais sans attendre Windows si ça bloque)
  # ────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false          # ← très important : continue même si Windows plante

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'       # ← on passe à 1.22 (plus stable + mieux supporté)
          cache: false             # ← désactive le cache → contourne le bug fréquent sur Windows
          # Si tu veux réactiver le cache plus tard → cache: true + cache-dependency-path: '**/go.sum'

      - name: Download modules
        run: go mod download

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o adgo.exe ./cmd/adgo
          else
            go build -o adgo ./cmd/adgo
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adgo-${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}
          path: adgo*
          if-no-files-found: error

  # ────────────────────────────────────────────────
  # Tests + race + coverage (seulement sur Linux → plus fiable)
  # ────────────────────────────────────────────────
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false             # idem : on désactive pour éviter les flakes

      - name: Download modules
        run: go mod download

      - name: Run tests (with race detector)
        run: go test -v -race -timeout 120s ./...

      - name: Coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Show total coverage
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  # ────────────────────────────────────────────────
  # Lint (golangci-lint) — très utile pour ton projet
  # ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number

  # ────────────────────────────────────────────────
  # Release (se déclenche seulement sur tag vX.Y.Z)
  # ────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # utile pour les notes de release auto

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build all release binaries
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o adgo-windows-amd64.exe   ./cmd/adgo
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o adgo-linux-amd64         ./cmd/adgo
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o adgo-darwin-amd64        ./cmd/adgo
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o adgo-linux-arm64         ./cmd/adgo
          # Optionnel : GOOS=darwin GOARCH=arm64 si tu veux aussi macOS arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            adgo-windows-amd64.exe
            adgo-linux-amd64
            adgo-darwin-amd64
            adgo-linux-arm64
          generate_release_notes: true
          draft: false